<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="سجّلي دخولك على بيليكو وابدئي تسوّقي من أي مكان في العالم." />
<title>Beleco — تسجيل الدخول</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B14020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beleco">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-top:#FEE7D5;
    --grad-mid1:#FDD3B2;
    --grad-mid2:#F6B88F;
    --grad-mid3:#D37B58;
    --grad-bottom:#B14020;
    --primary:#CD5E33;
    --primary-dark:#7A2005;
    --dark:#2B1D14;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  
  html {
    min-height: 100%;
    background-color: var(--grad-bottom); 
  }
  
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    font-family: 'Cairo', sans-serif;
    color: #fff;
    background: linear-gradient(180deg, var(--grad-top) 0%, var(--grad-mid1) 25%, var(--grad-mid2) 50%, var(--grad-mid3) 75%, var(--grad-bottom) 100%);
    background-attachment: fixed;
    overscroll-behavior: none;
  }
  
  .wrap{
    max-width:420px;
    margin:0 auto;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    min-height:calc(100dvh + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:calc(28px + env(safe-area-inset-top, 0px)) 26px calc(24px + env(safe-area-inset-bottom, 0px));
    position:relative;
  }

  .lang-toggle{
    position:absolute;
    top:calc(20px + env(safe-area-inset-top, 0px));
    left:20px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.16);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    padding:7px 12px;
    color:#fff;
    font-family:'Cairo';
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
  .lang-toggle svg{ width:14px; height:14px; stroke:#fff; }
  html[dir="ltr"] .lang-toggle{ left:auto; right:20px; }

  .logo-mark{
    display:block;
    width:110px; height:auto;
    margin:0 auto 26px 0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    text-align:center;
    margin:0 0 8px;
    color:#fff;
  }
  .sub{
    text-align:center;
    font-size:13.5px;
    color:rgba(255,255,255,.78);
    margin:0 0 28px;
    line-height:1.6;
  }

  .oauth-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 16px;
    border-radius:999px;
    border:none;
    background:#fff;
    color:var(--dark);
    font-family:'Cairo';
    font-weight:700;
    font-size:14.5px;
    margin-bottom:12px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
  }
  .oauth-btn svg{ width:19px; height:19px; flex-shrink:0; }
  .oauth-btn.apple{ background:var(--dark); color:#fff; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:20px 0 18px;
    color:rgba(255,255,255,.65);
    font-size:12px;
    font-weight:700;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.28);
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:rgba(255,255,255,.85);
    margin-bottom:7px;
  }
  .field-input-wrap{ position:relative; }
  .field input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.32);
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    font-family:'Cairo';
    font-size:16px;
    color:#fff;
    outline:none;
  }
  .field input::placeholder{ color:rgba(255,255,255,.55); }
  .field input:focus{ border-color:rgba(255,255,255,.7); }
  .pw-toggle{
    position:absolute;
    top:50%; transform:translateY(-50%);
    left:14px;
    background:none; border:none; padding:4px;
    cursor:pointer;
    display:flex;
  }
  html[dir="ltr"] .pw-toggle{ left:auto; right:14px; }
  .pw-toggle svg{ width:18px; height:18px; stroke:rgba(255,255,255,.75); }

  button.primary{
    width:100%;
    padding:15px;
    margin-top:6px;
    border:none;
    border-radius:14px;
    background:var(--dark);
    color:#fff;
    font-family:'Cairo';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
  }
  button.primary:disabled{ opacity:.6; }

  .error{
    color:#FFD9CF;
    background:rgba(179,39,28,.35);
    border:1px solid rgba(255,255,255,.25);
    border-radius:10px;
    padding:9px 12px;
    font-size:13px;
    margin-top:12px;
    text-align:center;
    display:none;
  }

  .link-row{
    text-align:center;
    margin-top:20px;
  }
  .link-btn{
    background:none;
    border:none;
    color:rgba(255,255,255,.85);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    font-family:'Cairo';
    padding:6px;
  }

  #recaptcha-container{ display:flex; justify-content:center; margin:14px 0; }

  .back-arrow{
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.28);
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  html[dir="ltr"] .back-arrow{ right:auto; left:20px; }
  .back-arrow svg{ width:17px; height:17px; stroke:#fff; }
  html[dir="rtl"] .back-arrow svg{ transform:scaleX(-1); }

  .screen{ display:none; }
  .screen.active{ display:block; }
</style>
</head>
<body>

<div class="wrap">

  <!-- Screen: choose sign-in method -->
  <div class="screen active" id="screen-choose">
    <button class="lang-toggle" id="langToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="langLabel">EN</span>
    </button>

    <img class="logo-mark" src="logo-black.png" alt="Beleco" />

    <h1 data-i18n="choose.title">أهلاً بيكِ تاني</h1>
    <p class="sub" data-i18n="choose.sub">سجّلي دخولك عشان تكمّلي طلبك وتتابعي أوردراتك بسهولة.</p>

    <button class="oauth-btn" id="googleBtn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.5 5.5 0 0 1-2.39 3.62v3h3.86c2.26-2.08 3.56-5.15 3.56-8.86z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.86-3c-1.07.72-2.45 1.15-4.08 1.15-3.13 0-5.79-2.11-6.74-4.96H1.28v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.26 14.29A7.2 7.2 0 0 1 4.88 12c0-.8.14-1.57.38-2.29v-3.1H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l3.98-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.28 6.61l3.98 3.1C6.21 6.86 8.87 4.75 12 4.75z"/></svg>
      <span data-i18n="choose.google">متابعة بحساب جوجل</span>
    </button>

    <button class="oauth-btn apple" id="appleBtn">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.36 1.43c0 1.14-.46 2.2-1.2 2.98-.84.87-2.16 1.55-3.27 1.46-.15-1.1.41-2.24 1.16-2.99.83-.86 2.28-1.5 3.31-1.45zM20.9 17.3c-.53 1.22-.78 1.77-1.46 2.85-.95 1.5-2.29 3.38-3.95 3.4-1.47.01-1.85-.96-3.85-.95-2 .01-2.42.97-3.89.96-1.66-.02-2.93-1.7-3.88-3.2C1.28 16.94.6 12.4 2.3 9.35c.92-1.65 2.6-2.7 4.4-2.73 1.55-.03 2.6 1.04 3.85 1.04 1.24 0 2.63-1.09 4.44-1.05 1.2.02 3.05.34 4.18 1.86-3.4 2.04-2.85 5.63-.27 8.83z"/></svg>
      <span data-i18n="choose.apple">متابعة بحساب آبل</span>
    </button>

    <div class="divider" data-i18n="choose.or">أو</div>

    <!-- فورم مجمعة عشان الآيفون ميعملش ريفريش إجباري -->
    <form id="loginForm">
      <div class="field">
        <label data-i18n="id.label">ID</label>
        <div class="field-input-wrap">
          <input type="text" id="idInput" autocapitalize="off" autocomplete="username" data-i18n-placeholder="id.placeholder" placeholder="اكتبي الـID" />
        </div>
      </div>
      <div class="field">
        <label data-i18n="pw.label">Password</label>
        <div class="field-input-wrap">
          <input type="password" id="idPasswordInput" autocomplete="current-password" data-i18n-placeholder="pw.placeholder" placeholder="اكتبي الباسورد" />
          <button type="button" class="pw-toggle" id="pwToggleBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="primary" id="idLoginBtn" data-i18n="id.signin">دخول</button>
      <p class="error" id="idError"></p>
    </form>

    <div class="link-row">
      <button class="link-btn" id="phoneBtn" data-i18n="choose.phone">تسجيل الدخول برقم الموبايل</button>
    </div>

    <p class="error" id="chooseError"></p>
  </div>

  <!-- Screen: enter phone number -->
  <div class="screen" id="screen-phone">
    <button class="back-arrow" id="backToChoose1">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7M2 12h20"/></svg>
    </button>
    <img class="logo-mark" src="logo-black.png" alt="Beleco" />
    <h1 data-i18n="phone.title">رقم موبايلك</h1>
    <p class="sub" data-i18n="phone.sub">هنبعتلك كود تأكيد على واتساب/SMS.</p>
    <div class="field">
      <label data-i18n="phone.label">رقم الموبايل</label>
      <div class="field-input-wrap">
        <input type="tel" id="phoneInput" placeholder="+20 10 1234 5678" />
      </div>
    </div>
    <div id="recaptcha-container"></div>
    <button class="primary" id="sendCodeBtn" data-i18n="phone.send">إرسال الكود</button>
    <p class="error" id="phoneError"></p>
  </div>

  <!-- Screen: enter OTP code -->
  <div class="screen" id="screen-otp">
    <button class="back-arrow" id="backToChoose2">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7M2 12h20"/></svg>
    </button>
    <img class="logo-mark" src="logo-black.png" alt="Beleco" />
    <h1 data-i18n="otp.title">اكتبي الكود</h1>
    <p class="sub" id="otpSentTo" data-i18n="otp.sub">وصلك كود على موبايلك.</p>
    <div class="field">
      <label data-i18n="otp.label">كود التأكيد</label>
      <div class="field-input-wrap">
        <input type="text" id="otpInput" inputmode="numeric" placeholder="123456" maxlength="6" />
      </div>
    </div>
    <button class="primary" id="verifyCodeBtn" data-i18n="otp.verify">تأكيد</button>
    <p class="error" id="otpError"></p>
  </div>

</div>

<script>
  // منع الـ Zoom على الـ iOS
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("gesturechange", (e) => e.preventDefault());
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup,
    RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhu8GZoXw-_MdqGPt63ZDB4Srpfzq-Cm4",
    authDomain: "beleco-orders.firebaseapp.com",
    projectId: "beleco-orders",
    storageBucket: "beleco-orders.firebasestorage.app",
    messagingSenderId: "865521869863",
    appId: "1:865521869863:web:7dcfb86a4e9af542131a02"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    // ضفت كود كسر الكاش عشان لما يروح لـ app.html ميحملش نسخة قديمة وترجعه تاني
    if (user) window.location.replace("app.html?v=" + new Date().getTime());
  });

  const translations = {
    ar: {
      "choose.title": "أهلاً بيكِ تاني",
      "choose.sub": "سجّلي دخولك عشان تكمّلي طلبك وتتابعي أوردراتك بسهولة.",
      "choose.google": "متابعة بحساب جوجل",
      "choose.apple": "متابعة بحساب آبل",
      "choose.or": "أو",
      "choose.phone": "تسجيل الدخول برقم الموبايل",
      "id.label": "ID",
      "id.placeholder": "اكتبي الـID",
      "pw.label": "الباسورد",
      "pw.placeholder": "اكتبي الباسورد",
      "id.signin": "دخول",
      "phone.title": "رقم موبايلك",
      "phone.sub": "هنبعتلك كود تأكيد على واتساب/SMS.",
      "phone.label": "رقم الموبايل",
      "phone.send": "إرسال الكود",
      "otp.title": "اكتبي الكود",
      "otp.sub": "وصلك كود على موبايلك.",
      "otp.label": "كود التأكيد",
      "otp.verify": "تأكيد",
      "common.back": "رجوع",
    },
    en: {
      "choose.title": "Welcome Back",
      "choose.sub": "Sign in to complete your order and track your purchases easily.",
      "choose.google": "Continue with Google",
      "choose.apple": "Continue with Apple",
      "choose.or": "OR",
      "choose.phone": "Sign in with phone number",
      "id.label": "ID",
      "id.placeholder": "Type your ID",
      "pw.label": "Password",
      "pw.placeholder": "Password...",
      "id.signin": "Sign In",
      "phone.title": "Your phone number",
      "phone.sub": "We'll send you a confirmation code via WhatsApp/SMS.",
      "phone.label": "Phone number",
      "phone.send": "Send code",
      "otp.title": "Enter the code",
      "otp.sub": "A code was sent to your phone.",
      "otp.label": "Confirmation code",
      "otp.verify": "Verify",
      "common.back": "Back",
    },
  };

  function applyLanguage(lang){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("langLabel").textContent = lang === "ar" ? "EN" : "AR";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.dataset.i18n;
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      const key = el.dataset.i18nPlaceholder;
      if (translations[lang][key]) el.placeholder = translations[lang][key];
    });
  }

  let currentLang = "ar";
  applyLanguage(currentLang);

  document.getElementById("langToggle").addEventListener("click", () => {
    currentLang = currentLang === "ar" ? "en" : "ar";
    applyLanguage(currentLang);
  });

  const screens = {
    choose: document.getElementById("screen-choose"),
    phone: document.getElementById("screen-phone"),
    otp: document.getElementById("screen-otp"),
  };
  function showScreen(name){
    Object.values(screens).forEach((s) => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  /* ---------------- Google ---------------- */
  document.getElementById("googleBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("chooseError");
    errorEl.style.display = "none";
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
      window.location.replace("app.html?v=" + new Date().getTime());
    } catch (err) {
      errorEl.textContent = "حصل خطأ، جرّبي تاني";
      errorEl.style.display = "block";
    }
  });

  /* ---------------- Apple ---------------- */
  document.getElementById("appleBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("chooseError");
    errorEl.style.display = "none";
    try {
      await signInWithPopup(auth, new OAuthProvider("apple.com"));
      window.location.replace("app.html?v=" + new Date().getTime());
    } catch (err) {
      errorEl.textContent = "تسجيل الدخول بآبل مش متاح دلوقتي";
      errorEl.style.display = "block";
    }
  });

  /* ---------------- Phone ---------------- */
  document.getElementById("phoneBtn").addEventListener("click", () => {
    showScreen("phone");
    if (!window.recaptchaVerifier) {
      window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "normal" });
    }
  });
  document.getElementById("backToChoose1").addEventListener("click", () => showScreen("choose"));
  document.getElementById("backToChoose2").addEventListener("click", () => showScreen("choose"));

  let confirmationResult = null;

  document.getElementById("sendCodeBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("phoneError");
    errorEl.style.display = "none";
    const phone = document.getElementById("phoneInput").value.trim();
    if (!phone) {
      errorEl.textContent = "اكتبي رقم موبايل صحيح";
      errorEl.style.display = "block";
      return;
    }
    try {
      confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
      document.getElementById("otpSentTo").textContent =
        (translations[currentLang]["otp.sub"] || "") + " (" + phone + ")";
      showScreen("otp");
    } catch (err) {
      errorEl.textContent = "حصل خطأ في إرسال الكود، جرّبي تاني";
      errorEl.style.display = "block";
    }
  });

  document.getElementById("verifyCodeBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("otpError");
    errorEl.style.display = "none";
    const code = document.getElementById("otpInput").value.trim();
    if (!code || !confirmationResult) {
      errorEl.textContent = "اكتبي الكود اللي وصلك";
      errorEl.style.display = "block";
      return;
    }
    try {
      await confirmationResult.confirm(code);
      window.location.replace("app.html?v=" + new Date().getTime());
    } catch (err) {
      errorEl.textContent = "الكود غلط، جرّبي تاني";
      errorEl.style.display = "block";
    }
  });

  /* ---------------- ID & Password ---------------- */
  const ID_EMAIL_DOMAIN = "beleco-admin.local";

  document.getElementById("pwToggleBtn").addEventListener("click", () => {
    const input = document.getElementById("idPasswordInput");
    input.type = input.type === "password" ? "text" : "password";
  });

  // تم تغيير الحدث لـ submit بدلاً من click عشان الآيفون يفهمه كـ Form
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // السطر ده بيمنع الآيفون إنه يعمل ريفريش غصب عننا
    
    const errorEl = document.getElementById("idError");
    errorEl.style.display = "none";
    const idValue = document.getElementById("idInput").value.trim();
    const passwordValue = document.getElementById("idPasswordInput").value;
    
    if (!idValue || !passwordValue) {
      errorEl.textContent = "من فضلك اكتبي الـID والباسورد";
      errorEl.style.display = "block";
      return;
    }
    
    const fakeEmail = idValue.toLowerCase() + "@" + ID_EMAIL_DOMAIN;
    const btn = document.getElementById("idLoginBtn");
    const oldText = btn.textContent;
    btn.textContent = "...";
    btn.disabled = true;

    try {
      await signInWithEmailAndPassword(auth, fakeEmail, passwordValue);
      window.location.replace("app.html?v=" + new Date().getTime());
    } catch (err) {
      errorEl.textContent = "ID أو الباسورد غلط";
      errorEl.style.display = "block";
      btn.textContent = oldText;
      btn.disabled = false;
    }
  });
</script>
