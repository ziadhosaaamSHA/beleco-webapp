<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Beleco</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#FEE7D5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --dark:#2B1D14;
    --primary:#CD5E33;
    --primary-dark:#7A2005;
    --text:#2B1D14;
    --muted:#8A7368;
    --grad-top:#FEE7D5;
    --grad-mid1:#FDD3B2;
    --grad-mid2:#F6B88F;
    --grad-mid3:#D37B58;
    --grad-bottom:#B14020;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; width:100%;
    background:
      linear-gradient(180deg, var(--grad-top) 0%, var(--grad-mid1) 25%, var(--grad-mid2) 50%, var(--grad-mid3) 75%, var(--grad-bottom) 100%);
    font-family:'Cairo', sans-serif;
    color:var(--text);
    overflow:hidden;
    overscroll-behavior:none;
  }
  .wrap{
    max-width:420px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    height:calc(100dvh + env(safe-area-inset-bottom, 0px));
    width:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:calc(20px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px));
  }

  .collage{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:10px;
    flex:1;
    min-height:0;
  }
  .collage img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:20px;
  }
  .tile-tall{ grid-row:1 / 3; }
  .tile-tall img{ height:100%; }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    text-align:center;
    line-height:1.35;
    margin:10px 0 8px;
    color:#fff;
  }
  .sub{
    text-align:center;
    color:rgba(255,255,255,.85);
    font-size:13.5px;
    line-height:1.7;
    margin:0 0 22px;
    padding:0 6px;
  }

  .cta{
    width:100%;
    padding:16px;
    border:none;
    border-radius:999px;
    background:var(--dark);
    color:#fff;
    font-family:'Cairo';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="collage">
    <div class="tile-tall">
      <img src="https://picsum.photos/seed/beleco1/500/620" alt="" />
    </div>
    <img src="https://picsum.photos/seed/beleco2/400/290" alt="" />
    <img src="https://picsum.photos/seed/beleco3/400/290" alt="" />
  </div>

  <h1>ارفعي مستوى ستايلك<br/>مع كل قطعة تختاريها</h1>
  <p class="sub">اطلبي من شي إن وتريندايول وأشهر البراندات العالمية، وهيوصلك لباب بيتك في مصر والإمارات.</p>

  <button class="cta" id="getStartedBtn">ابدئي دلوقتي</button>

</div>

<script>
  document.getElementById("getStartedBtn").addEventListener("click", () => {
    window.location.href = "login.html";
  });
</script>

</body>
</html>
